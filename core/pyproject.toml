[build-system]
requires = ["scikit-build-core>=0.9", "pybind11>=2.11"]
build-backend = "scikit_build_core.build"

[project]
name = "resple-offline"
version = "0.1.0"
description = "Offline pybind11 bridge for the pinned upstream RESPLE estimator"
requires-python = ">=3.10"
dependencies = ["numpy"]

[tool.scikit-build]
cmake.build-type = "Release"
wheel.packages = ["python/resple"]

[tool.uv]
cache-keys = [
  { file = "cpp/**" },
  { file = "patches/**/*.patch" },
  { file = "CMakeLists.txt" },
  { git = { commit = true } },
]
